name: Build Image

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (e.g. frontend, backend) — used for cache scope and image name'
        required: true
        type: string
      dockerfile:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      image:
        description: 'Image name (without registry)'
        required: true
        type: string
      version:
        description: 'Version tag to apply (e.g. run number)'
        required: true
        type: string
      no_cache:
        description: 'If true, ignore build cache (use when build secrets changed)'
        required: false
        type: boolean
        default: false
    secrets:
      BUILD_ENV:
        description: >-
          Build-time env file contents, mounted as build secret id=build_env.
          Only pass this for components whose Dockerfile actually mounts it
          (frontend: Vite inlines VITE_* at build time). Omit it otherwise —
          the backend reads its config from the runtime environment, so passing
          a build secret there would suggest the image receives keys it never gets.
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ inputs.component }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ inputs.image }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      # 시크릿을 셸 명령줄에 보간하지 않고 환경변수로 넘긴다.
      # `printf '%s' "${{ secrets.X }}"`는 값에 따옴표나 백틱이 들어 있으면 스크립트가
      # 깨지고, 값이 명령줄에 남는다.
      - name: Write build env file
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          printf '%s' "$BUILD_ENV" > build.env
          chmod 600 build.env

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache }}
          cache-from: ${{ inputs.no_cache && '' || format('type=gha,scope={0}', inputs.component) }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
          secret-files: |
            build_env=build.env

      - name: Clean up env file
        if: always()
        run: rm -f build.env
