name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_cache:
        description: '빌드 캐시 무시 (secret 변경 시 체크)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # 타입 검사·테스트·린트 게이트.
  # 예전에는 이 단계가 없어, 타입 오류나 실패하는 테스트가 그대로 빌드·배포까지 갔다.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, test, lint
        run: pnpm run verify

  resolve:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.out.outputs.frontend }}
      backend: ${{ steps.out.outputs.backend }}
    steps:
      - uses: actions/checkout@v6

      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend_only:
              - 'frontend/**'
            backend_only:
              - 'backend/**'

      - id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            # 반대 필터: backend만 변경되면 frontend 스킵, frontend만 변경되면 backend 스킵
            FE_ONLY="${{ steps.filter.outputs.frontend_only }}"
            BE_ONLY="${{ steps.filter.outputs.backend_only }}"
            echo "frontend=$( [ "$BE_ONLY" = 'true' ] && [ "$FE_ONLY" = 'false' ] && echo false || echo true )" >> "$GITHUB_OUTPUT"
            echo "backend=$( [ "$FE_ONLY" = 'true' ] && [ "$BE_ONLY" = 'false' ] && echo false || echo true )" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    needs: [verify, resolve]
    if: needs.resolve.outputs.frontend == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      component: frontend
      dockerfile: ./frontend/Dockerfile
      image: ${{ github.repository_owner }}/greedyrunner-fe
      version: ${{ github.run_number }}
      no_cache: ${{ inputs.no_cache || false }}
    secrets:
      BUILD_ENV: ${{ secrets.FRONTEND_ENV }}

  build-backend:
    needs: [verify, resolve]
    if: needs.resolve.outputs.backend == 'true'
    uses: ./.github/workflows/_build-image.yml
    with:
      component: backend
      dockerfile: ./backend/Dockerfile
      image: ${{ github.repository_owner }}/greedyrunner-be
      version: ${{ github.run_number }}
      no_cache: ${{ inputs.no_cache || false }}
    # BUILD_ENV를 넘기지 않는다. backend/Dockerfile은 build_env 시크릿을 마운트하지 않고,
    # 백엔드는 AIR_KOREA_API_KEY·KMA_API_KEY를 런타임 환경변수로 받는다(Dockhand가 주입).
    # 예전에는 BACKEND_BUILD_ENV를 빌드 시크릿으로 넘겨 놓고 아무도 읽지 않아,
    # "빌드에 키가 들어간다"는 잘못된 인상을 줬다.

  deploy:
    needs: [verify, resolve, build-frontend, build-backend]
    if: |
      always() &&
      !cancelled() &&
      needs.verify.result == 'success' &&
      needs.resolve.result == 'success' &&
      needs.build-frontend.result != 'failure' &&
      needs.build-backend.result != 'failure' &&
      (needs.resolve.outputs.frontend == 'true' || needs.resolve.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dockhand redeploy
        uses: GreedyLabs/action-dockhand-webhook@v1
        with:
          url: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
          secret: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}

  # 프론트엔드 배포 후 IndexNow(빙/네이버)에 sitemap URL 전체를 제출
  indexnow:
    needs: [resolve, deploy]
    if: |
      always() &&
      !cancelled() &&
      needs.deploy.result == 'success' &&
      needs.resolve.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Ping IndexNow with sitemap URLs
        run: node frontend/scripts/indexnow-ping.mjs
