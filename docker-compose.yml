services:
  backend:
    image: ghcr.io/greedylabs/greedyrunner-be:${BACKEND_TAG:-latest}
    container_name: greedyrunner-be
    restart: unless-stopped
    env_file:
      - backend.env
    environment:
      - TZ=Asia/Seoul
    ports:
      - "8001:8000"

  frontend:
    image: ghcr.io/greedylabs/greedyrunner-fe:${FRONTEND_TAG:-latest}
    container_name: greedyrunner-fe
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
