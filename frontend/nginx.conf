server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 리다이렉트 Location을 상대 경로로 (Cloudflare 뒤에서 http→https 이중 홉 방지)
    absolute_redirect off;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    # 보안 헤더 (add_header를 쓰는 location에서는 다시 include해야 함)
    include /etc/nginx/snippets/security-headers.conf;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # API 요청을 백엔드로 프록시 (검색 색인 대상 아님)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }

    # Swagger 문서 프록시 (검색 색인 대상 아님)
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }

    # 헬스체크 프록시 (검색 색인 대상 아님)
    location /health {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }

    # 모든 유효 라우트는 빌드 시 dist/<route>/index.html로 프리렌더된다.
    # 파일이 없는 경로는 SPA 폴백 대신 진짜 404를 반환 (soft-404 방지).
    error_page 404 /404.html;
    location / {
        # 끝 슬래시 정규화: /tips/ → /tips 301 (중복 URL 방지)
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # 정적 자산 캐싱 (Vite 해시 파일은 장기 캐싱)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 루트의 이미지/아이콘/robots/sitemap/llms.txt 등은 짧게 캐싱
    # (sw.js는 여기 매칭되지 않고 location /의 no-cache를 따라야 함)
    location ~* \.(png|jpg|jpeg|webp|svg|ico|txt|xml|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
}
