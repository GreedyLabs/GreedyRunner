server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 리다이렉트 Location을 상대 경로로 (Cloudflare 뒤에서 http→https 이중 홉 방지)
    absolute_redirect off;

    # Docker DNS resolver.
    # proxy_pass에 **변수**를 써야 이 resolver가 실제로 쓰인다 — 리터럴 호스트명을 쓰면
    # nginx가 기동 시 한 번 해석해 그 IP를 영구히 붙들고, 백엔드 컨테이너가 재생성되어
    # IP가 바뀌면 API 전체가 502가 된다. 프론트엔드 이미지가 다시 빌드되기 전까지
    # (며칠이 걸릴 수 있다) 자체 복구되지 않는다. HTML·CSS·JS는 계속 정상 서빙되므로
    # 사용자에게는 정확히 "사이트는 열리는데 Open API만 되다 안되다"로 보였다.
    #
    # 변수를 쓰면 기동 시점에 해석하지 않으므로, 백엔드보다 먼저 떠도 nginx가
    # "host not found in upstream"으로 기동에 실패하며 사이트 전체를 내리는 문제도 사라진다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $backend_host backend;

    # 보안 헤더 (add_header를 쓰는 location에서는 다시 include해야 함)
    include /etc/nginx/snippets/security-headers.conf;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # API 요청을 백엔드로 프록시 (검색 색인 대상 아님)
    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 백엔드의 상류 예산은 최악 12초(지역 검색)다. nginx 기본값 60초는 그보다 훨씬 길어,
        # 백엔드가 매달리면 사용자도 60초를 기다린다. 백엔드 예산보다 조금 길게 잡아
        # 백엔드가 스스로 504를 내려보낼 여유는 주되 그 이상은 끊는다.
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 20s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }

    # Swagger 문서 프록시 (검색 색인 대상 아님)
    location /docs {
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }

    # 헬스체크 프록시 (검색 색인 대상 아님)
    location /health {
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Robots-Tag "noindex" always;
    }

    # 모든 유효 라우트는 빌드 시 dist/<route>/index.html로 프리렌더된다.
    # 파일이 없는 경로는 SPA 폴백 대신 진짜 404를 반환 (soft-404 방지).
    error_page 404 /404.html;
    location / {
        # 끝 슬래시 정규화: /tips/ → /tips 301 (중복 URL 방지)
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri/index.html =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # 정적 자산 캐싱 (Vite 해시 파일은 장기 캐싱)
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 루트의 이미지/아이콘/robots/sitemap/llms.txt 등은 짧게 캐싱
    # (sw.js는 여기 매칭되지 않고 location /의 no-cache를 따라야 함)
    location ~* \.(png|jpg|jpeg|webp|svg|ico|txt|xml|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
    }
}
